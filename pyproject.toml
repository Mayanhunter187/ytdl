[project]
name = "ytdl"
version = "1.3.1"
description = "Desktop GUI for downloading YouTube videos and audio, powered by yt-dlp"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "yt-dlp[default]",
    "customtkinter>=5.2",
    "imageio-ffmpeg>=0.5",
    "deno>=2.0",
    "pillow>=10",
    "tkinterdnd2>=0.6.3",
]

[project.scripts]
ytdl = "ytdl.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytdl"]
