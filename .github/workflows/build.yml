name: Build

# Every push and pull request builds YTDL.exe and attaches it to the run as an
# artifact. Pushing a version tag (v1.2.3) also publishes a GitHub Release with
# the exe and its SHA-256, which is what the app's "Update now" downloads.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies with the newest yt-dlp
        run: uv sync --upgrade-package yt-dlp

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(uv run python -c "import ytdl; print(ytdl.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version in src/ytdl/__init__.py"
            exit 1
          fi

      - name: Build YTDL.exe
        run: uv run python build.py

      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum YTDL.exe > YTDL.exe.sha256
          cat YTDL.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: YTDL
          path: |
            dist/YTDL.exe
            dist/YTDL.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yt_dlp=$(uv run python -c "import importlib.metadata as m; print(m.version('yt-dlp'))")
          notes="Download **YTDL.exe** below and run it. Nothing else to install.

          Bundles yt-dlp $yt_dlp (the app keeps yt-dlp up to date on its own). Already using YTDL? Open About → Update now.

          Windows SmartScreen may warn about an unrecognized app the first time: click *More info → Run anyway*.
          Verify the download with \`YTDL.exe.sha256\` if you like."
          gh release create "$GITHUB_REF_NAME" dist/YTDL.exe dist/YTDL.exe.sha256 \
            --title "YTDL ${GITHUB_REF_NAME#v}" --notes "$notes" --generate-notes
